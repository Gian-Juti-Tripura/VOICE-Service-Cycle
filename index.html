<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VOICE Hub" />
    
    <!-- Preconnect Google Fonts for Sub-10ms Font Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Professional Typography: Inter (Ultra-Crisp Professional UI), Hind Siliguri (Bengali), Cinzel (Vedic Accents) -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    
    <title>Advaita VOICE Digital Hub | University of Chittagong</title>
    <meta name="description" content="Official Advaita VOICE Digital Portal - 14-Course Syllabus, 12-Day Service Cycle Engine, Digital Sadhana Scoring, and Mentorship." />
    <meta name="theme-color" content="#14532d" />
    
    <!-- OneSignal Web Push SDK v16 for PWA Notifications -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  </head>
  <body class="antialiased selection:bg-amber-500 selection:text-white">
    <div id="root">
      <style>
        #app-splash-loader {
          position: fixed;
          inset: 0;
          z-index: 999999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: radial-gradient(ellipse at 50% 38%, #16a34a 0%, #14532d 45%, #052e16 100%);
          overflow: hidden;
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
          user-select: none;
          -webkit-user-select: none;
        }

        /* Ambient cosmic particles */
        .splash-particle {
          position: absolute;
          border-radius: 50%;
          background: radial-gradient(circle, #fde68a 0%, rgba(245, 158, 11, 0.4) 60%, transparent 100%);
          pointer-events: none;
        }
        .splash-p1 { width: 4px; height: 4px; top: 22%; left: 18%; animation: splashFloat 6s ease-in-out infinite; opacity: 0.6; }
        .splash-p2 { width: 6px; height: 6px; top: 68%; left: 78%; animation: splashFloat 8s ease-in-out infinite 1s; opacity: 0.5; }
        .splash-p3 { width: 3px; height: 3px; top: 30%; right: 20%; animation: splashFloat 5s ease-in-out infinite 2s; opacity: 0.7; }
        .splash-p4 { width: 5px; height: 5px; bottom: 25%; left: 24%; animation: splashFloat 7s ease-in-out infinite 3s; opacity: 0.4; }
        .splash-p5 { width: 3px; height: 3px; top: 15%; left: 52%; animation: splashFloat 6.5s ease-in-out infinite 0.5s; opacity: 0.6; }

        /* Outer cosmic ambient aura */
        .splash-aura {
          position: absolute;
          width: 320px;
          height: 320px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(245, 158, 11, 0.18) 0%, rgba(16, 185, 129, 0.12) 40%, transparent 70%);
          filter: blur(40px);
          animation: splashAuraPulse 4s ease-in-out infinite alternate;
          pointer-events: none;
        }

        /* Rotating golden celestial rings */
        .splash-orbit-ring {
          position: absolute;
          width: 172px;
          height: 172px;
          border-radius: 50%;
          border: 1px dashed rgba(251, 191, 36, 0.35);
          animation: splashSpin 24s linear infinite;
        }

        .splash-orbit-ring-outer {
          position: absolute;
          width: 198px;
          height: 198px;
          border-radius: 50%;
          border: 1px solid rgba(217, 119, 6, 0.18);
          animation: splashSpinRev 36s linear infinite;
        }

        /* Center Icon Stage */
        .splash-icon-stage {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 144px;
          height: 144px;
          margin-bottom: 24px;
          animation: splashLogoFloat 4s ease-in-out infinite;
        }

        .splash-icon-img {
          width: 128px;
          height: 128px;
          border-radius: 50%;
          box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7), 0 0 35px rgba(245, 158, 11, 0.35);
          object-fit: cover;
          display: block;
        }

        /* Branding Typography */
        .splash-title {
          font-family: 'Cinzel', serif, Georgia;
          font-size: 22px;
          font-weight: 800;
          letter-spacing: 0.18em;
          background: linear-gradient(135deg, #fffbeb 0%, #fde68a 30%, #f59e0b 65%, #d97706 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin: 0;
          padding: 0;
          text-align: center;
          text-transform: uppercase;
        }

        .splash-subtitle {
          font-family: 'Hind Siliguri', sans-serif;
          font-size: 13px;
          font-weight: 500;
          color: rgba(251, 191, 36, 0.85);
          margin-top: 6px;
          letter-spacing: 0.04em;
          text-align: center;
        }

        .splash-motto {
          font-size: 11px;
          font-style: italic;
          color: #94a3b8;
          margin-top: 5px;
          letter-spacing: 0.16em;
          text-align: center;
        }

        /* Shimmer Progress Line */
        .splash-progress-track {
          width: 130px;
          height: 2.5px;
          background: rgba(255, 255, 255, 0.08);
          border-radius: 999px;
          overflow: hidden;
          margin-top: 28px;
          position: relative;
        }

        .splash-progress-fill {
          position: absolute;
          top: 0;
          left: 0;
          height: 100%;
          width: 45%;
          background: linear-gradient(90deg, transparent, #fbbf24, #f59e0b, transparent);
          animation: splashSweep 1.6s ease-in-out infinite;
          border-radius: 999px;
        }

        @keyframes splashLogoFloat {
          0%, 100% { transform: translateY(0px) scale(1); }
          50% { transform: translateY(-7px) scale(1.02); }
        }

        @keyframes splashAuraPulse {
          0% { transform: scale(0.9); opacity: 0.6; }
          100% { transform: scale(1.15); opacity: 0.95; }
        }

        @keyframes splashSpin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }

        @keyframes splashSpinRev {
          from { transform: rotate(360deg); }
          to { transform: rotate(0deg); }
        }

        @keyframes splashSweep {
          0% { left: -45%; }
          100% { left: 100%; }
        }

        @keyframes splashFloat {
          0%, 100% { transform: translateY(0) translateX(0); }
          50% { transform: translateY(-12px) translateX(6px); }
        }
      </style>
      <div id="app-splash-loader">
        <div class="splash-aura"></div>
        <div class="splash-particle splash-p1"></div>
        <div class="splash-particle splash-p2"></div>
        <div class="splash-particle splash-p3"></div>
        <div class="splash-particle splash-p4"></div>
        <div class="splash-particle splash-p5"></div>

        <div class="splash-icon-stage">
          <div class="splash-orbit-ring-outer"></div>
          <div class="splash-orbit-ring"></div>
          <img src="/logo.png" alt="Advaita VOICE" class="splash-icon-img" />
        </div>

        <h1 class="splash-title">Advaita VOICE</h1>
        <div class="splash-subtitle">শ্রীশ্রী রাধামাধব • আশ্রম ও সাধনা পোর্টাল</div>
        <div class="splash-motto">✦ Dare to be Rare • হরে কৃষ্ণ ✦</div>

        <div class="splash-progress-track">
          <div class="splash-progress-fill"></div>
        </div>
      </div>
    </div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('Advaita VOICE ServiceWorker active:', reg.scope);
          }).catch((err) => {
            console.warn('ServiceWorker registration error:', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
